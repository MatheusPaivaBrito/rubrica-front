# Production template. The official Nginx image substitutes RUBRICA_DOMAIN.

server {
  listen 80;
  listen [::]:80;
  server_name ${RUBRICA_DOMAIN};

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ${RUBRICA_DOMAIN};

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/rubrica/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rubrica/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:RubricaTLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:" always;

  # Only Cloudflare ranges may supply CF-Connecting-IP as the client address.
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $auth_api http://auth-api:8000;
  set $core_api http://core-api:8000;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Cookie $http_cookie;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  location = /health {
    proxy_pass $core_api;
    add_header Cache-Control "no-store" always;
  }

  location /auth/ {
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /sessions/ {
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /access-control/ {
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /users {
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /documents {
    proxy_pass $core_api;
    proxy_request_buffering off;
    add_header Cache-Control "private, no-store" always;
  }

  location /signature-requests {
    proxy_pass $core_api;
    add_header Cache-Control "private, no-store" always;
  }

  location /signing/links/ {
    proxy_pass $core_api;
    add_header Cache-Control "private, no-store" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /pdf.worker.min.mjs {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
