# Production template. The official Nginx image substitutes RUBRICA_DOMAIN.

limit_req_zone $binary_remote_addr zone=rubrica_api_per_ip:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=rubrica_auth_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rubrica_upload_per_ip:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=rubrica_contact_per_ip:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=rubrica_connections_per_ip:10m;

server {
  listen 80;
  listen [::]:80;
  server_name ${RUBRICA_DOMAIN};

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  keepalive_requests 500;
  large_client_header_buffers 4 8k;
  server_tokens off;
  limit_conn rubrica_connections_per_ip 30;
  limit_conn_status 429;
  limit_req_status 429;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; frame-src 'self' blob: https://challenges.cloudflare.com" always;

  # Only Cloudflare ranges may supply CF-Connecting-IP as the client address.
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  # Cloudflare Tunnel is the only public path to this container. Trust its
  # private Docker hop so limits use the visitor IP from CF-Connecting-IP.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $auth_api http://auth-api:8000;
  set $core_api http://core-api:8000;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Cookie $http_cookie;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  location = /health {
    proxy_pass $core_api;
    add_header Cache-Control "no-store" always;
  }

  location /auth/ {
    limit_req zone=rubrica_auth_per_ip burst=15 nodelay;
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /sessions/ {
    limit_req zone=rubrica_api_per_ip burst=30 nodelay;
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /access-control/ {
    limit_req zone=rubrica_api_per_ip burst=30 nodelay;
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /users {
    limit_req zone=rubrica_api_per_ip burst=30 nodelay;
    proxy_pass $auth_api;
    add_header Cache-Control "no-store" always;
  }

  location /documents {
    client_max_body_size 50m;
    client_body_timeout 30s;
    limit_req zone=rubrica_upload_per_ip burst=8 nodelay;
    proxy_pass $core_api;
    add_header Cache-Control "private, no-store" always;
  }

  location /tenants {
    limit_req zone=rubrica_api_per_ip burst=30 nodelay;
    proxy_pass $core_api;
    add_header Cache-Control "private, no-store" always;
  }

  location /billing {
    limit_req zone=rubrica_api_per_ip burst=30 nodelay;
    proxy_pass $core_api;
    add_header Cache-Control "private, no-store" always;
  }

  location /contact/ {
    limit_req zone=rubrica_contact_per_ip burst=5 nodelay;
    proxy_pass $core_api;
    add_header Cache-Control "no-store" always;
  }

  location = /contact { try_files /contact/index.html =404; }
  location = /contact/ { return 301 /contact; }
  location = /enterprise { try_files /enterprise/index.html =404; }
  location = /enterprise/ { return 301 /enterprise; }
  location = /privacy { try_files /privacy/index.html =404; }
  location = /privacy/ { return 301 /privacy; }
  location = /terms { try_files /terms/index.html =404; }
  location = /terms/ { return 301 /terms; }
  location = /data-deletion { try_files /data-deletion/index.html =404; }
  location = /data-deletion/ { return 301 /data-deletion; }

  location = /contato { return 301 /contact; }
  location = /privacidade { return 301 /privacy; }
  location = /termos { return 301 /terms; }
  location = /exclusao-de-dados { return 301 /data-deletion; }

  location /signature-requests {
    limit_req zone=rubrica_api_per_ip burst=30 nodelay;
    proxy_pass $core_api;
    add_header Cache-Control "private, no-store" always;
  }

  location /signing/links/ {
    limit_req zone=rubrica_api_per_ip burst=30 nodelay;
    proxy_pass $core_api;
    add_header Cache-Control "private, no-store" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /index.csr.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /ngsw.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~ ^/pdf\.worker\.(?:min|compat)\.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.csr.html;
  }
}
