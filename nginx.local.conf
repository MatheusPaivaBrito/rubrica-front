server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Cookie $http_cookie;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $auth_api http://auth-api:8000;
  set $core_api http://core-api:8000;

  location = /health { proxy_pass $core_api; add_header Cache-Control "no-store" always; }
  location /auth/ { proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /sessions/ { proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /access-control/ { proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /users { proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /documents { proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /tenants { proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /billing { proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /signature-requests { proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /signing/links/ { proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }

  location = /ngsw-worker.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /ngsw.json { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; try_files $uri =404; }

  location ~ ^/pdf\.worker\.(?:min|compat)\.mjs$ {
    default_type text/javascript;
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ /index.html; }
}
