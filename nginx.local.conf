limit_req_zone $binary_remote_addr zone=rubrica_api_per_ip:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=rubrica_auth_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rubrica_upload_per_ip:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=rubrica_contact_per_ip:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=rubrica_connections_per_ip:10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  keepalive_requests 500;
  server_tokens off;
  limit_conn rubrica_connections_per_ip 30;
  limit_conn_status 429;
  limit_req_status 429;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header Cookie $http_cookie;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $auth_api http://auth-api:8000;
  set $core_api http://core-api:8000;

  location = /health { proxy_pass $core_api; add_header Cache-Control "no-store" always; }
  location /auth/ { limit_req zone=rubrica_auth_per_ip burst=15 nodelay; proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /sessions/ { limit_req zone=rubrica_api_per_ip burst=30 nodelay; proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /access-control/ { limit_req zone=rubrica_api_per_ip burst=30 nodelay; proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /users { limit_req zone=rubrica_api_per_ip burst=30 nodelay; proxy_pass $auth_api; add_header Cache-Control "no-store" always; }
  location /documents { client_max_body_size 50m; client_body_timeout 30s; limit_req zone=rubrica_upload_per_ip burst=8 nodelay; proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /tenants { limit_req zone=rubrica_api_per_ip burst=30 nodelay; proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /billing { limit_req zone=rubrica_api_per_ip burst=30 nodelay; proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /contact/ { limit_req zone=rubrica_contact_per_ip burst=5 nodelay; proxy_pass $core_api; add_header Cache-Control "no-store" always; }
  location = /contact { try_files /contact/index.html =404; }
  location = /contact/ { return 301 /contact; }
  location = /enterprise { try_files /enterprise/index.html =404; }
  location = /enterprise/ { return 301 /enterprise; }
  location = /privacy { try_files /privacy/index.html =404; }
  location = /privacy/ { return 301 /privacy; }
  location = /terms { try_files /terms/index.html =404; }
  location = /terms/ { return 301 /terms; }
  location = /data-deletion { try_files /data-deletion/index.html =404; }
  location = /data-deletion/ { return 301 /data-deletion; }
  location = /contato { return 301 /contact; }
  location = /privacidade { return 301 /privacy; }
  location = /termos { return 301 /terms; }
  location = /exclusao-de-dados { return 301 /data-deletion; }
  location /signature-requests { limit_req zone=rubrica_api_per_ip burst=30 nodelay; proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }
  location /signing/links/ { limit_req zone=rubrica_api_per_ip burst=30 nodelay; proxy_pass $core_api; add_header Cache-Control "private, no-store" always; }

  location = /ngsw-worker.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /ngsw.json { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location ~ ^/pdf\.worker\.(?:min|compat)\.mjs$ {
    default_type text/javascript;
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ /index.csr.html; }
}
