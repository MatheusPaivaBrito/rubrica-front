name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint
        run: npx ng lint

      - name: Run unit and route contract tests
        run: npm test -- --watch=false

      - name: Build Angular and SSR bundles
        run: npm run build
      - name: Install Chromium for release regression tests
        run: npx playwright install --with-deps chromium

      - name: Exercise release flows on desktop and mobile
        shell: bash
        run: |
          PORT=18080 node dist/rubrica-web/server/server.mjs > /tmp/rubrica-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          npm run test:e2e -- --project=pc --project=android-novo -g 'mostra a bandeira|exibe arquivo|configura posições|enviar convite'
